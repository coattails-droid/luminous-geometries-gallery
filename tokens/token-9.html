    let x = FQX[i] + FDX[i] * fc + FCX[i] * fs + FTX[i] * FSD[i] * fk;
    let y = FQY[i] + FDY[i] * fc + FCY[i] * fs + FTY[i] * FSD[i] * fk;
    let z = FQZ[i] + FDZ[i] * fc + FCZ[i] * fs, br = 1;
    const fm = FAM[i];
    if (fm === 0 || fm === 2) {
      const d = DIST[i];
      let g;
      const spiralHere = WAVE_MODE === 2;
      if (WAVE_MODE === 4) {
        g = 0; // wave off: steady
      } else if (spiralHere) {
        // spiral: rotating twisted arms, steady radius (no zoom pulsing — Calvin 2026-10-07)
        const lon = Math.atan2(y - CV[1], x - CV[0]);
        const tw = lon * 2 - (d / RMAX) * 5.0 + TAU * lp * 2;
        const arm = 0.5 + 0.5 * Math.cos(tw);
        g = 0.25 + 0.75 * arm * arm;
      } else {
        let dw1 = Math.abs(d - W0A), dw2 = Math.abs(d - W0B);
        const q1 = dw1 / 0.22;
        const g1 = Math.exp(-q1 * q1);
        const q2 = dw2 / 0.22;
        const g2 = W0B < 0 ? 0 : Math.exp(-q2 * q2);
        g = Math.max(g1, g2);
      }
      // spiral is brightness-only (no positional displacement) so its radius
      // matches the still viewpoint exactly (Calvin 2026-10-07).
      // Keep the modulation tight against still's br=1.0 so the palette
      // colorization stays visually consistent across both motions (Calvin 2026-10-07).
      br = fm === 0 ? 0.9 + 0.1 * Math.min(g, 1.2) : 0.95 + 0.05 * g;
    }
    if (fm === 0) {
      // spin the shell systems in place about the z-axis through the fixed
      // center (currently invisible: the beam is set to constant brightness,
      // so the uniform shells show no surface feature — the transform is
      // kept so a spin cue can be re-added later)
      const ra = TAU * lp * SHELL_TURNS, ca = Math.cos(ra), sa = Math.sin(ra);
      const px = x - CV[0], py = y - CV[1];
      x = CV[0] + px * ca - py * sa;
      y = CV[1] + px * sa + py * ca;
      // limb fade: shells dissolve to 100% transparency at their silhouette
      // edges — fade each point by how face-on its surface normal is to the
      // camera (normal = radial direction from the center; DIST holds R)
      const invR = 1 / DIST[i];
      const nx = (x - CV[0]) * invR, ny = (y - CV[1]) * invR, nz = (z - CV[2]) * invR;
      const facing = Math.abs(nx * b.fx + ny * b.fy + nz * b.fz);
      br *= Math.pow(facing, 1.5);
    }
    const sx = x * b.rx + y * b.ry + z * b.rz - b.ox;
    const sy = x * b.ux + y * b.uy + z * b.uz - b.oy;
    const sz = x * b.fx + y * b.fy + z * b.fz;
    SXA[i] = sx; SYA[i] = sy; SZA[i] = sz; BRA[i] = br;
    if (sz < smin) smin = sz;
    if (sz > smax) smax = sz;
    // accent-dot blink retired (Calvin 2026-10-05): dots stay on steady
    ALA[i] = 1;
  }

  pxd.fill(0);
  const span = Math.max(smax - smin, 1e-6);
  const half = S / 2;
  for (let i = 0; i < TOT; i++) {
    // wash off (Calvin 2026-10-05 audition): skip the volumetric glow family
    if (!WASH_ON && FAM[i] === 3) continue;
    const zn = (smax - SZA[i]) / span;  // 1 = nearest: near geometry renders brighter
    // shells render flat (no depth shading): constant color and brightness
    // (Calvin 2026-10-05)
    const sh = (FAM[i] === 0 ? 1 : (0.65 + 0.35 * zn)) * BRA[i] * (FAM[i] === 2 ? ALA[i] : 1);
    let r = RR[i] * sh * 255, g = GG[i] * sh * 255, bl = BB[i] * sh * 255;
    // accent dots punch through the wash; the outer ring renders dimmer
    // (OUTER_DOT_DIM) and dissolves at the rim (OFADE: 1 → 0 by radius).
    // dots whose contribution rounds to black leave pixels untouched —
    // an opaque-black alpha stamp would show as shadow dots under the
    // rotated duplicate layers.
    if (FAM[i] === 2) {
      const dg = DOT_GAIN * (RING[i] === 1 ? OUTER_DOT_DIM : 1) * OFADE[i];
      r *= dg; g *= dg; bl *= dg;
      if (r + g + bl < 1.5) continue;
    }
    // shells: SHELL_GAIN halves their accumulation strength (opacity)
    // heart exempt: renders at 100% (Calvin 2026-10-06)
    if (FAM[i] === 0 && !HEART[i]) { r *= SHELL_GAIN; g *= SHELL_GAIN; bl *= SHELL_GAIN; }
    const Xp = Math.round(SXA[i] * SC + half), Yp = Math.round(SYA[i] * SC + half);
    if (Xp < 0 || Yp < 0 || Xp >= S || Yp >= S) continue;
    if (FAM[i] === 2) {
      // accent triangles: upright triangular core + soft radial wash for a 3D glow
      // (outer ring renders smaller + dimmer)
      const os = RING[i] === 1 ? OUTER_DOT_SIZE : 1;
      const RT = 2.6 * DOT_CORE_SCALE * os, W = 16 / 3 * os; // circumradius ≈ area of the old 16/9 disc
      // upright triangle vertices, screen space (y down): apex up
      const ax = 0, ay = -RT, bx = -0.8660254 * RT, by = 0.5 * RT,
            cx = 0.8660254 * RT, cy = 0.5 * RT;
      for (let dy = -W; dy <= W; dy++) {
        const yy = Yp + dy;
        if (yy < 0 || yy >= S) continue;
        const dxm = Math.floor(Math.sqrt(W * W - dy * dy));
        for (let dx = -dxm; dx <= dxm; dx++) {
          const xx = Xp + dx;
          if (xx < 0 || xx >= S) continue;
          const d = Math.sqrt(dx * dx + dy * dy);
          const t = Math.max(0, 1 - d / W), wa = t * t * 0.5; // wash falloff
          // point-in-triangle: all three edge half-plane tests agree
          const s1 = (dx - cx) * (ay - cy) - (ax - cx) * (dy - cy);
          const s2 = (dx - ax) * (by - ay) - (bx - ax) * (dy - ay);
          const s3 = (dx - bx) * (cy - by) - (cx - bx) * (dy - by);
          const core = ((s1 >= 0 && s2 >= 0 && s3 >= 0) ||
                        (s1 <= 0 && s2 <= 0 && s3 <= 0)) ? 1 : 0;
          const o = (yy * S + xx) * 4;
          pxd[o] = Math.min(255, pxd[o] + r * (core + wa));
          pxd[o + 1] = Math.min(255, pxd[o + 1] + g * (core + wa));
          pxd[o + 2] = Math.min(255, pxd[o + 2] + bl * (core + wa));
          pxd[o + 3] = 255;
        }
      }
      continue;
    }
    if (FAM[i] === 0) {
      // wave shells: 2x2 so the wavefront reads in the negative space.
      // points whose contribution rounds to black are skipped, and alpha
      // tracks brightness — so dim limb points can't stamp opaque-black
      // squares that the rotated duplicates would reveal as shadow dots.
      if (r + g + bl < 1.5) continue;
      const sa = HEART[i] ? 255 : Math.min(255, (r + g + bl) / 3);
      for (let ddy = 0; ddy < 2; ddy++) for (let ddx = 0; ddx < 2; ddx++) {
        const xx = Xp + ddx, yy = Yp + ddy;
        if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue;
        const o2 = (yy * S + xx) * 4;
        pxd[o2] = Math.min(255, pxd[o2] + r);
        pxd[o2 + 1] = Math.min(255, pxd[o2 + 1] + g);
        pxd[o2 + 2] = Math.min(255, pxd[o2 + 2] + bl);
        if (sa > pxd[o2 + 3]) pxd[o2 + 3] = sa;
      }
      continue;
    }
    let o = (Yp * S + Xp) * 4;
    pxd[o] = Math.min(255, pxd[o] + r);
    pxd[o + 1] = Math.min(255, pxd[o + 1] + g);
    pxd[o + 2] = Math.min(255, pxd[o + 2] + bl);
    pxd[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // soft glow pass: blurred copy of the sharp frame laid back over itself
  // (reduced 2026-10-05: less glow overall, and the webbing now draws after
  // it so the threads stay razor sharp instead of being blurred)
  ctx.save();
  ctx.filter = "blur(2px)";
  ctx.globalAlpha = 0.25;
  ctx.drawImage(cv, 0, 0);
  ctx.restore();
  // accent web, ember layer: 1px ember threads joining each dot to its 12
  // nearest neighbors (drawn at the very bottom of the stack)
  ctx.save();
  ctx.globalAlpha = PAL.web12[1];
  if (PAL.webGrad) {
    const wg = ctx.createRadialGradient(half, half, 0, half, half, SC * 0.5);
    PAL.webGrad.forEach((c, i) => wg.addColorStop(i / (PAL.webGrad.length - 1), c));
    ctx.strokeStyle = wg;
  } else {
    ctx.strokeStyle = PAL.web12[0];
  }
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0; s < CPAIRS12.length; s++) {
    const a = CPAIRS12[s][0], b2 = CPAIRS12[s][1];
    ctx.moveTo(SXA[a] * SC + half, SYA[a] * SC + half);
    ctx.lineTo(SXA[b2] * SC + half, SYA[b2] * SC + half);
  }
  ctx.stroke();
  ctx.restore();
  // accent web, magenta layer: 1px light-neon-magenta threads joining each
  // dot to its 9 nearest neighbors
  ctx.save();
  ctx.globalAlpha = PAL.web9[1];
  if (PAL.webGrad) {
    const wg = ctx.createRadialGradient(half, half, 0, half, half, SC * 0.5);
    PAL.webGrad.forEach((c, i) => wg.addColorStop(i / (PAL.webGrad.length - 1), c));
    ctx.strokeStyle = wg;
  } else {
    ctx.strokeStyle = PAL.web9[0];
  }
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0; s < CPAIRS9.length; s++) {
    const a = CPAIRS9[s][0], b2 = CPAIRS9[s][1];
    ctx.moveTo(SXA[a] * SC + half, SYA[a] * SC + half);
    ctx.lineTo(SXA[b2] * SC + half, SYA[b2] * SC + half);
  }
  ctx.stroke();
  ctx.restore();
  // accent web, purple layer: 1px light-neon-purple threads joining each dot
  // to its 6 nearest neighbors (drawn under the green layer)
  ctx.save();
  ctx.globalAlpha = PAL.web6[1];
  if (PAL.webGrad) {
    const wg = ctx.createRadialGradient(half, half, 0, half, half, SC * 0.5);
    PAL.webGrad.forEach((c, i) => wg.addColorStop(i / (PAL.webGrad.length - 1), c));
    ctx.strokeStyle = wg;
  } else {
    ctx.strokeStyle = PAL.web6[0];
  }
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0; s < CPAIRS6.length; s++) {
    const a = CPAIRS6[s][0], b2 = CPAIRS6[s][1];
    ctx.moveTo(SXA[a] * SC + half, SYA[a] * SC + half);
    ctx.lineTo(SXA[b2] * SC + half, SYA[b2] * SC + half);
  }
  ctx.stroke();
  ctx.restore();
  // accent web, green layer: faint threads joining each dot to its 3 nearest
  // neighbors, redrawn every frame (the viewpoint orbits, so projections move)
  ctx.save();
  ctx.globalAlpha = PAL.web3[1];
  if (PAL.webGrad) {
    const wg = ctx.createRadialGradient(half, half, 0, half, half, SC * 0.5);
    PAL.webGrad.forEach((c, i) => wg.addColorStop(i / (PAL.webGrad.length - 1), c));
    ctx.strokeStyle = wg;
  } else {
    ctx.strokeStyle = PAL.web3[0];
  }
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0; s < CPAIRS.length; s++) {
    const a = CPAIRS[s][0], b2 = CPAIRS[s][1];
    ctx.moveTo(SXA[a] * SC + half, SYA[a] * SC + half);
    ctx.lineTo(SXA[b2] * SC + half, SYA[b2] * SC + half);
  }
  ctx.stroke();
  ctx.restore();

  // (grade moved to end of frame in preview 38)
  // duplicated layers: the entire composition re-composited centered at
  // 90° ccw, 90° cw, 180°, 30° cw, and 60° cw (Calvin 2026-10-05).
  // each pass draws the current canvas, so later passes also re-rotate
  // earlier duplicates — redrawn identical pixels are no-ops, leaving
  // exactly: original + the five rotations, all at DUP_ALPHA.
  // (canvas positive angle = clockwise, y-axis down)
  for (const ang of [-Math.PI / 2, Math.PI / 2, Math.PI, Math.PI / 6, Math.PI / 3]) {
    ctx.save();
    ctx.globalAlpha = DUP_ALPHA;
    ctx.translate(half, half);
    ctx.rotate(ang);
    ctx.drawImage(cv, -half, -half);
    ctx.restore();
  }
  // final grade — punchiest it gets (Calvin 2026-10-05): full saturation push
  // on the finished composite. (brightness lifts tested 1.15–1.45 all added
  // haze; saturation alone keeps the blacks deep and the lines defined.)
  ctx.save();
  ctx.filter = "saturate(1.7)";
  ctx.drawImage(cv, 0, 0);
  ctx.restore();
  // central sphere blur: soften the heart with a blurred composite (Calvin 2026-10-06)
  {
    const hr = HEART_AR * SC * 2.0; // heart radius with margin
    const hsz = Math.ceil(hr * 2);
    if (heartBlurCv.width !== hsz) { heartBlurCv.width = heartBlurCv.height = hsz; }
    heartBlurCtx.clearRect(0, 0, hsz, hsz);
    heartBlurCtx.drawImage(cv, half - hr, half - hr, hsz, hsz, 0, 0, hsz, hsz);
    ctx.save();
    ctx.filter = "blur(8px)";
    ctx.drawImage(heartBlurCv, half - hr, half - hr);
    ctx.restore();
  }
  // eclipse occluder: solid disc at the heart, drawn last (Calvin 2026-10-06)
  if (PAL.eclipse) {
    ctx.save();
    ctx.globalAlpha = PAL.eclipseAlpha !== undefined ? PAL.eclipseAlpha : 1;
    const er = PAL.eclipse * HEART_AR * SC;
    // spherical shading: light from above, darker on bottom edge and sides
    const eg = ctx.createRadialGradient(half, half - er * 0.45, er * 0.1, half, half, er);
    eg.addColorStop(0, PAL.eclipseColor || "#000");
    eg.addColorStop(1, "#1a0800");
    if (PAL.eclipseHalf) {
      // half disc: left half only, right cut away (mirrored, Calvin 2026-10-06)
      // soft blur on the disc edge (Calvin 2026-10-07)
      if (PAL.eclipseBlur) ctx.filter = `blur(${PAL.eclipseBlur}px)`;
      ctx.fillStyle = PAL.eclipseColor || "#000";
      ctx.beginPath();
      ctx.arc(half, half, er, Math.PI / 2, Math.PI * 3 / 2);
      ctx.closePath();
      ctx.fill();
      ctx.filter = "none";
    } else {
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.arc(half, half, er, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
